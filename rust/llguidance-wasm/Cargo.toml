[package]
name = "transformers-llguidance-wasm"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
getrandom = "0.3"
llguidance = { version = "=1.2.0", default-features = false, features = ["lark", "wasm", "referencing"] }
toktrie = "=1.2.0"

[profile.release]
# compute_mask() runs per generated token; optimize for speed, not size.
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-O3",
  "--enable-simd",
  "--enable-bulk-memory",
  "--enable-nontrapping-float-to-int",
  "--enable-sign-ext",
  "--enable-mutable-globals",
]
